<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Synapse – Dashboard</title>
<style>
:root{--bg:#f0f1f5;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--ln:#e5e7eb;--bl:#2a78d6;--bl2:#a9c8ef;--rd:#e24a4a;--am:#f5a524;--gy:#9aa0aa;--sel:#e3edf9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa3af;--ln:#2c323b;--bl:#4c97ee;--bl2:#35537a;--rd:#ef6a6a;--am:#f5b53f;--sel:#1f3047}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa3af;--ln:#2c323b;--bl:#4c97ee;--bl2:#35537a;--rd:#ef6a6a;--am:#f5b53f;--sel:#1f3047}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--ln);padding:22px 14px}
aside h1{font-size:21px;margin:0 0 26px 10px}aside nav{display:flex;flex-direction:column;gap:2px}
aside a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;color:var(--mu);text-decoration:none;font-size:15px}
aside a.on{background:var(--sel);color:var(--bl);font-weight:600}aside a:hover{color:var(--tx)}
.bd{background:var(--am);color:#1b1f27;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
header{background:var(--card);border-bottom:1px solid var(--ln);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h2{margin:0;font-size:22px}.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=date],select{background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:7px 10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:2px}
.seg button{border:0;background:0;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--mu)}.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--ln)}
main{padding:20px 24px}.g{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;min-width:0}
.c h3{margin:0 0 2px;font-size:17px}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
.k .l{color:var(--mu);font-size:13px}.k .v{font-size:38px;font-weight:700;line-height:1.2}.k .s{color:var(--mu);font-size:13px}.up{color:#1a8f4a;font-weight:600;font-size:13px}.dn{color:var(--rd);font-weight:600;font-size:13px}
.k.q{border-left:5px solid var(--am)}.pb{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--bl)}
.ch{width:100%;height:auto}.tk{fill:var(--mu);font-size:11px}.hit{fill:transparent;cursor:pointer}.hit:hover{fill:var(--sel);fill-opacity:.5}
.lg{display:flex;flex-wrap:wrap;gap:14px;color:var(--mu);font-size:13px;margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.dv{display:grid;grid-template-columns:70px 1fr 1px 1fr;align-items:center;gap:0 8px;margin:10px 0}.dv .l,.dv .r{display:flex;height:34px;align-items:center}.dv .l{justify-content:flex-end}.dv .m{height:60px;background:var(--mu);opacity:.4}
.dv i{display:block;height:100%;color:#fff;font-weight:700;padding:0 8px;line-height:34px;font-style:normal}.dv span{padding:0 6px;font-weight:600}
.rw{display:grid;grid-template-columns:minmax(110px,170px) 1fr 100px;gap:12px;align-items:center;margin:11px 0}.rw .t{height:11px;background:var(--ln);border-radius:9px;overflow:hidden}.rw .t i{display:block;height:100%;background:var(--bl);border-radius:9px}.rw.f{opacity:.45}
.b{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid;font-size:12px;white-space:nowrap}.bu{background:#e24a4a22;border-color:#e24a4a99}.bn{background:#f5a52422;border-color:#f5a52499}.bx{background:#9aa0aa22;border-color:#9aa0aa99}.bh{background:#2a78d622;border-color:#2a78d699}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{color:var(--mu);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--ln);cursor:default}td{padding:10px 8px;border-bottom:1px solid var(--ln)}td.n,th.n{text-align:right}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--sel)}
.kr{display:grid;grid-template-columns:24px 120px 1fr 52px 62px;gap:10px;align-items:center;padding:11px 8px;border-radius:9px;cursor:pointer}.kr.on{background:var(--sel)}.kr b{font-size:15px}.kb{display:flex;gap:2px;height:14px}.kb i{display:block;height:100%}
.kd{border-top:1px solid var(--ln);padding:12px 0}.kd p{margin:6px 0;font-size:15px}.kd small{color:var(--mu)}mark{background:#f5d9a0;color:#1b1f27;border-radius:4px;padding:0 3px;font-weight:700}
.btn{background:var(--bl);color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:600;cursor:pointer}.pill{border:1px solid var(--ln);background:var(--bg);border-radius:99px;padding:5px 14px;cursor:pointer;color:var(--mu)}.pill.on{background:var(--sel);color:var(--bl);border-color:var(--bl);font-weight:600}
.qg{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px}.qi{padding:12px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--ln)}.qi.on{background:var(--sel);box-shadow:inset 3px 0 var(--bl)}.qi.dn2{opacity:.5}.qi div{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px;color:var(--mu);font-size:13px}
.ms{max-width:70%;padding:9px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);margin:10px 0 2px}.ms.b2{margin-left:auto;background:var(--sel)}.mt{font-size:12px;color:var(--mu)}.mt.r{text-align:right}
.src{border-left:4px solid var(--mu);background:var(--bg);padding:9px 12px;margin:10px 0;font-size:13px;color:var(--mu)}.rt{background:var(--bg);border-radius:12px;padding:14px;margin-top:14px}.rb{display:flex;gap:10px;margin:10px 0}.rb button{flex:1;padding:12px;border:2px solid var(--ln);background:var(--card);border-radius:10px;cursor:pointer;font-weight:600}.rb button.h.on{border-color:var(--bl);background:#2a78d622}.rb button.u.on{border-color:var(--rd);background:#e24a4a22}
textarea{width:100%;border:1px solid var(--ln);border-radius:9px;background:var(--card);padding:9px;min-height:60px}.er{color:var(--rd);font-size:13px}.wc{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;color:var(--mu)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{padding:10px;border:0;border-bottom:1px solid var(--ln)}aside h1{margin:0 0 8px 4px}aside nav{flex-direction:row;overflow-x:auto}aside a{white-space:nowrap;gap:8px}.qg{grid-template-columns:1fr}main,header{padding:14px}.kr{grid-template-columns:20px 90px 1fr 48px 58px}}
</style></head><body><div class="app"><aside><h1>Synapse</h1><nav id="nav"></nav></aside><div><header><h2 id="ttl"></h2><div class="ctl" id="ctl"></div></header><main id="main"></main></div></div>
<script>
const $=s=>document.querySelector(s),f1=v=>(Math.round(v*10)/10).toString().replace('.',','),N=v=>Math.round(v).toLocaleString('vi-VN');
let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const D0=Date.UTC(2026,8,1),ND=83,dt=i=>new Date(D0+i*864e5),p2=v=>('0'+v).slice(-2),fm=i=>{const d=dt(i);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)},iso=i=>dt(i).toISOString().slice(0,10);
const R=[['Hộ Nguyễn Văn A',.54],['Hộ Trần Thị B',.61],['Phòng hỗ trợ chung',.68],['Hộ Lê Văn C',.74],['Hộ Phạm Văn D',.8],['Hộ Hoàng Thị E',.86]];
const US=[['@nguyen.a','Nguyễn Văn A'],['@tran.b','Trần Thị B'],['@le.c','Lê Văn C'],['@pham.d','Phạm Văn D'],['@hoang.e','Hoàng Thị E'],['@vu.f','Vũ Thị F'],['@do.g','Đỗ Minh G'],['@bui.h','Bùi Quang H']];
const KW=[['không hiểu',.75],['báo lỗi',.72],['hỏi lại',.7],['chậm',.62],['không nhận được',.6],['chữ ký số',.35],['hoá đơn điện tử',.3],['mã số thuế',.22]];
const E=[],M=[],L=[],LU=[],K=[];
for(let d=0;d<ND;d++){const wk=[0,6].includes(dt(d).getUTCDay())?.6:1;let e=[],m=[],l=[];
R.forEach(([,p],r)=>{const t=Math.max(3,Math.round((8+rnd()*8)*wk*(r==2?1.5:1))),ev=Math.round(t*(.28+rnd()*.15)),h=Math.round(ev*Math.min(.95,p+(rnd()-.5)*.3)),n=Math.round(t*.1),x=Math.max(0,t-ev-n);
e.push({h,u:ev-h,n,x});m.push({s:t,o:Math.round(t*(5+rnd()*4)),r:Math.round(t*(5+rnd()*4))});
const q=t*4,a=2.2+r*.25+rnd()*1.2+(d%17==3?2:0);l.push({n:q,q:q*a*(.7+rnd()*.15),p:q*a*(1.7+rnd()*.5),sl:Math.round(q*(.08+rnd()*.06)),to:Math.round(q*rnd()*.04)})});
E.push(e);M.push(m);L.push(l);LU.push(US.map((_,u)=>{const n=Math.round(rnd()*10),a=1.8+u*.35+rnd()*1.2;return{n,s:n*a*.8,p:n*a*1.9}}));
K.push(KW.map(([,s])=>{const t=4+rnd()*8;return{u:Math.round(t*s),h:Math.round(t*(1-s))}}))}
const LV=US.map((_,i)=>ND-1-Math.floor(rnd()*(i*4+1)));
const Q=[['Hộ Nguyễn Văn A','22/11 09:14',24,'u'],['Hộ Trần Thị B','22/11 08:02',11,'n'],['Phòng hỗ trợ chung','21/11 16:48',3,'x'],['Hộ Lê Văn C','21/11 14:31',9,'u'],['Hộ Phạm Văn D','21/11 11:05',8,'n'],['Hộ Hoàng Thị E','20/11 15:20',31,'u'],['Hộ Vũ Thị F','20/11 10:22',9,'x'],['Hộ Đỗ Minh G','19/11 17:40',14,'u'],['Hộ Bùi Quang H','19/11 09:03',6,'n']].map(([a,b,c,s],i)=>({id:i,name:a,t:b,n:c,s,done:0}));
const ST={h:['Hài lòng','bh','var(--bl)'],u:['Không hài lòng','bu','var(--rd)'],n:['Cần xem lại','bn','var(--am)'],x:['Không có phản hồi','bx','var(--gy)']};
const SRC={u:'AI · 09:40 — “người dùng phàn nàn tra cứu chậm, hỏi lại 3 lần”',n:'AI · 08:10 — “câu trả lời chưa chắc chắn, cần người xem lại”',x:'Hệ thống — phiên kết thúc, người dùng không phản hồi'};
const MS=[['u','Cho em tra hoá đơn tháng 10 với ạ','09:14'],['b','Dạ, em đang tra cứu giúp anh/chị…','09:14'],['u','sao lâu thế em ơi','09:17'],['b','Dạ em vẫn đang kiểm tra ạ','09:18'],['u','tra cứu gì mà <mark>chậm</mark> quá, em đợi 5 phút rồi','09:19']];
const TABS=[['tq','Tổng quan'],['kw','Từ khoá'],['rq','Hàng chờ xem lại'],['rm','Phòng chat'],['us','Người dùng'],['bt','Chất lượng bot']];
const S={tab:'tq',g:'d',from:61,to:82,room:-1,src:'u',ks:'r',kw:0,cloud:0,qf:'all',qi:0,rt:null,rs:'',err:''};
const days=()=>{const a=[];for(let d=S.from;d<=S.to;d++)a.push(d);return a},rooms=()=>S.room<0?R.map((_,i)=>i):[S.room];
function bk(a,b,g){const m=new Map;for(let d=a;d<=b;d++){const o=dt(d),k=g=='d'?d:g=='w'?d-(o.getUTCDay()+6)%7:o.getUTCFullYear()*12+o.getUTCMonth();if(!m.has(k))m.set(k,[]);m.get(k).push(d)}return[...m].map(([k,ds])=>({ds,lab:g=='d'?fm(ds[0]):g=='w'?'T'+fm(Math.max(0,k)):'Th'+(k%12+1)}))}
const sE=(ds,rs=rooms())=>{const o={h:0,u:0,n:0,x:0};ds.forEach(d=>rs.forEach(r=>{const e=E[d][r];for(const k in o)o[k]+=e[k]}));o.t=o.h+o.u+o.n+o.x;return o};
const sM=(ds,rs=rooms())=>{const o={s:0,o:0,r:0};ds.forEach(d=>rs.forEach(r=>{const e=M[d][r];for(const k in o)o[k]+=e[k]}));o.den=o.s?(o.o+o.r)/o.s:0;return o};
const sL=(ds,rs=rooms())=>{const o={n:0,q:0,p:0,sl:0,to:0};ds.forEach(d=>rs.forEach(r=>{const e=L[d][r];for(const k in o)o[k]+=e[k]}));o.p50=o.n?o.q/o.n:0;o.p90=o.n?o.p/o.n:0;return o};
const cs=o=>o.h+o.u?o.h/(o.h+o.u)*100:null,lg=a=>'<div class="lg">'+a.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+'</div>';
let CB=[];
function chart(lab,ser,o={}){const W=640,H=230,Lm=40,B=26,T=10,n=lab.length||1,pw=(W-Lm-8)/n;
let mx=o.max||Math.max(1,...(o.stack?lab.map((_,i)=>ser.reduce((s,x)=>s+(x.v[i]||0),0)):ser.flatMap(x=>x.v.map(v=>v||0))))*1.1;
const y=v=>T+(H-T-B)*(1-v/mx),x=i=>Lm+pw*(i+.5);let s=`<svg viewBox="0 0 ${W} ${H}" class="ch">`;
for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${Lm}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${Lm-6}" y="${y(v)+4}" text-anchor="end" class="tk">${o.pct?Math.round(v)+'%':f1(v)}</text>`}
const st=Math.ceil(n/8);lab.forEach((l,i)=>{if(i%st==0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="tk">${l}</text>`});
if(o.group)lab.forEach((_,i)=>{const w=pw*.8/ser.length;ser.forEach((q,j)=>{const v=q.v[i]||0;s+=`<rect x="${x(i)-pw*.4+j*w}" width="${w*.92}" y="${y(v)}" height="${y(0)-y(v)}" fill="${q.c}"/>`})});else if(o.stack)lab.forEach((_,i)=>{let a=0;ser.forEach(q=>{const v=q.v[i]||0;s+=`<rect x="${x(i)-pw*.35}" width="${pw*.7}" y="${y(a+v)}" height="${y(a)-y(a+v)}" fill="${q.c}"/>`;a+=v})});
else ser.forEach(q=>{let d='',op=0,last=-1;q.v.forEach((v,i)=>{if(v==null){op=0;return}d+=(op?'L':'M')+x(i)+','+y(v);op=1;last=i;if(n<30)d+=`M${x(i)},${y(v)}`+`m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0M${x(i)},${y(v)}`});s+=`<path d="${d}" fill="none" stroke="${q.c}" stroke-width="2.4" stroke-linejoin="round"/>`});
lab.forEach((l,i)=>{s+=`<rect class="hit" data-i="${i}" x="${x(i)-pw/2}" y="${T}" width="${pw}" height="${H-T-B}"><title>${l}: ${ser.map(q=>q.name+' '+(q.v[i]==null?'–':f1(q.v[i])+(o.pct?'%':''))).join(' · ')}</title></rect>`});
return s+'</svg>'}
const spark=v=>{const a=v.filter(x=>x!=null);if(a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a)+.01,w=110,h=34;return`<svg width="${w}" height="${h}"><polyline fill="none" stroke="var(--bl)" stroke-width="2" points="${a.map((x,i)=>(i*w/(a.length-1))+','+(h-3-(x-mn)/(mx-mn)*(h-6))).join(' ')}"/></svg>`};
const bdg=s=>`<span class="b ${ST[s][1]}">${ST[s][0]}</span>`;
function tq(){const ds=days(),c=sE(ds),len=ds.length,pd=S.from-len>=0?ds.map(d=>d-len):null,p=pd?sE(pd):null,cc=cs(c),pc=p?cs(p):null,B=bk(S.from,S.to,S.g),eb=B.map(b=>sE(b.ds)),ev=c.h+c.u,q=c.u+c.n+c.x,del=pc!=null&&cc!=null?cc-pc:null;
const mx=Math.max(c.h,c.u,p?p.h:0,p?p.u:0,1),dv=(l,h,u,f)=>`<div class="dv" style="${f?'opacity:.55':''}"><b>${l}</b><div class="l"><i style="width:${h/mx*100}%;background:${f?'var(--bl2)':'var(--bl)'}">${N(h)}</i></div><div class="m"></div><div class="r"><i style="width:${u/mx*100}%;background:${f?'#f5b5b5':'var(--rd)'}"></i><span>${N(u)}</span></div></div>`;
const rr=R.map((r,i)=>({n:r[0],e:sE(ds,[i]),i})).sort((a,b)=>b.e.u-a.e.u);
return`<div class="g g4"><div class="c k"><div class="l">Điểm hài lòng (CSAT)</div><div style="display:flex;justify-content:space-between;align-items:center"><div class="v">${cc==null?'–':Math.round(cc)+'%'}</div>${spark(eb.map(cs))}</div>${del==null?'':`<div class="${del>=0?'up':'dn'}">${del>=0?'▲':'▼'} ${f1(Math.abs(del))} điểm so kỳ trước</div>`}<div class="s">${N(ev)} / ${N(c.t)} phiên được đánh giá</div></div>
<div class="c k"><div class="l">Tỉ lệ phiên được đánh giá</div><div class="v">${c.t?Math.round(ev/c.t*100):0}%</div><div class="pb"><i style="width:${c.t?ev/c.t*100:0}%"></i></div><div class="s">${N(ev)} / ${N(c.t)} phiên</div></div>
<div class="c k"><div class="l"><span style="color:var(--rd)">■</span> Phiên không hài lòng</div><div class="v">${N(c.u)} <small class="s">phiên</small></div><div class="s">${c.t?f1(c.u/c.t*100):0}% tổng số phiên</div></div>
<div class="c k q"><div class="l">Hàng chờ xử lý</div><div class="v">${N(q)}</div><div class="s">${N(c.u)} không hài lòng · ${N(c.n)} cần xem lại<br>${N(c.x)} phiên không có phản hồi</div></div></div>
<div class="g g2"><div class="c"><h3>Phân bố đánh giá theo phiên</h3><p class="sub">Hài lòng ← → Không hài lòng. Phiên chưa đánh giá không tính vào thanh này.</p>${dv('Kỳ này',c.h,c.u)}${p?dv('Kỳ trước',p.h,p.u,1):''}<p class="sub" style="border-top:1px solid var(--ln);padding-top:10px;margin-top:14px">${N(c.n+c.x)} phiên chưa đánh giá — xem ô Tỉ lệ phiên được đánh giá</p></div>
<div class="c"><h3>Điểm hài lòng theo thời gian</h3><p class="sub">Ẩn mốc có dưới 5 phiên được đánh giá. Bấm vào cột thời gian để xem chi tiết hơn.</p>${chart(B.map(b=>b.lab),[{name:'CSAT',c:'var(--bl)',v:eb.map(e=>e.h+e.u<5?null:cs(e))}],{max:100,pct:1})}</div>
<div class="c"><h3>Điểm hài lòng theo phòng chat</h3><p class="sub">Xếp theo số phiên không hài lòng · n = số phiên được đánh giá</p>${rr.map(r=>{const v=cs(r.e),n=r.e.h+r.e.u;return`<div class="rw ${n<5?'f':''}"><span>${r.n}</span><div class="t"><i style="width:${v||0}%"></i></div><span>${v==null?'–':Math.round(v)+'%'} · n=${n}</span></div>`}).join('')}<p class="sub">Dòng mờ: n &lt; 5, chưa đủ mẫu</p></div>
<div class="c"><h3>Trạng thái phiên theo thời gian</h3><p class="sub">Số phiên theo từng kết quả đánh giá</p>${chart(B.map(b=>b.lab),['h','u','n','x'].map(k=>({name:ST[k][0],c:ST[k][2],v:eb.map(e=>e[k])})))}${lg(['h','u','n','x'].map(k=>[ST[k][0],ST[k][2]]))}</div></div>`}
function kws(){const sh=S.room<0?1:sE(days()).t/Math.max(1,sE(days(),R.map((_,i)=>i)).t),o=KW.map(([k],i)=>{let u=0,h=0;days().forEach(d=>{u+=K[d][i].u;h+=K[d][i].h});if(S.src=='ai'){u*=1.2;h*=.6}u=Math.round(u*sh);h=Math.round(h*sh);return{k,u,h,c:u+h}}),U=o.reduce((s,x)=>s+x.u,0)||1,A=o.reduce((s,x)=>s+x.c,0)||1;o.forEach(x=>x.r=x.c?(x.u/U)/(x.c/A):0);return o.sort((a,b)=>S.ks=='r'?b.r-a.r:b.c-a.c)}
function kw(){const o=kws(),mx=Math.max(1,...o.map(x=>x.c)),s=o[Math.min(S.kw,o.length-1)],qs=[['u','22/11 09:14','sao tra cứu lâu thế, # quá, em đợi 5 phút rồi',0,24],['u','21/11 16:48','hệ thống # quá, nộp mãi không được',2,17],['n','21/11 14:31','mạng # hay bot # vậy anh ơi',1,11],['h','20/11 10:22','lúc đầu hơi # nhưng xong rồi, cảm ơn em',3,9]];
const hl=t=>t.replace(/#/g,`<mark>${s.k}</mark>`);
return`<div class="sub" style="font-weight:600;margin-bottom:6px">NGUỒN VĂN BẢN</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="seg"><button data-a="src" data-v="u" class="${S.src=='u'?'on':''}">Lời người dùng</button><button data-a="src" data-v="ai" class="${S.src=='ai'?'on':''}">Lý do AI chấm</button></div><span class="sub" style="margin:0">Chỉ tính tin nhắn người dùng, đã loại tin của bot</span></div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))"><div class="c"><h3>Xếp hạng từ khoá theo mức tập trung</h3><p class="sub">Mức tập trung = tần suất trong phiên không hài lòng ÷ tần suất chung</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><label class="sub" style="margin:0">Sắp xếp theo <select id="ks"><option value="r" ${S.ks=='r'?'selected':''}>Mức tập trung</option><option value="c" ${S.ks=='c'?'selected':''}>Số lần xuất hiện</option></select></label>${lg([['phiên không hài lòng','var(--rd)'],['phiên hài lòng','var(--bl)']])}</div>
<div class="tw">${o.map((x,i)=>`<div class="kr ${i==S.kw?'on':''}" data-a="kw" data-v="${i}"><span class="sub" style="margin:0">${i+1}</span><b>${x.k}</b><div class="kb"><i style="width:${x.u/mx*100}%;background:var(--rd)"></i><i style="width:${x.h/mx*100}%;background:var(--bl)"></i></div><span style="text-align:right">${N(x.c)}</span><span class="b ${x.r>=2?'bu':'bx'}" style="text-align:center">×${f1(x.r)}</span></div>`).join('')}</div>
<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:12px"><label><input type="checkbox" data-a="cloud" ${S.cloud?'checked':''}> <b>Đám mây chữ</b></label> <span class="sub">Tắt sẵn · bật khi cần ảnh cho báo cáo giấy</span>${S.cloud?`<div class="wc">${[...o].sort((a,b)=>b.c-a.c).map(x=>`<span style="font-size:${13+x.c/mx*26}px;opacity:${.4+x.c/mx*.6}">${x.k}</span>`).join('')}</div><p class="sub">Cỡ chữ dùng để so sánh chính xác — dùng bảng xếp hạng ở trên</p>`:''}</div></div>
<div class="c"><h3>Phiên chứa từ khoá</h3><p class="sub">“${s.k}” · ${N(s.c)} lần trong ${N(s.c*.65)} phiên</p>${qs.map(([st,t,q,r,n])=>`<div class="kd"><div style="display:flex;justify-content:space-between"><small>${t}</small>${bdg(st)}</div><p>“${hl(q)}”</p><small>${R[r][0]} · ${n} tin</small></div>`).join('')}<button class="btn" style="width:100%" data-a="go" data-v="rq">Mở ${N(s.c*.65)} phiên trong Hàng chờ xem lại</button><p class="sub" style="margin-top:10px">Trích câu chứa từ khoá, không phải câu đầu phiên</p></div></div>`}
const pend=()=>Q.filter(x=>!x.done);
function rq(){const P=pend(),ls=S.qf=='all'?P:P.filter(x=>x.s==S.qf),cur=ls[Math.min(S.qi,ls.length-1)],cnt=s=>P.filter(x=>x.s==s).length;
const ch=[['all','Tất cả · '+P.length],['u','Không hài lòng · '+cnt('u')],['n','Cần xem lại · '+cnt('n')],['x','Không có phản hồi · '+cnt('x')]];
let det='<p class="sub">Không còn phiên nào trong bộ lọc này.</p>';
if(cur){const rt=S.rt||(cur.s=='u'?'u':null);det=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${cur.name} · ${cur.t}</h3>${bdg(cur.s)}</div><p class="sub">Phòng !${cur.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'-')}:matrix · ${cur.n} tin · kết thúc: hết giờ</p><div class="src">Nguồn đánh giá: ${SRC[cur.s]}</div>${MS.map(([w,t,h])=>`<div class="ms ${w=='b'?'b2':''}">${t}</div><div class="mt ${w=='b'?'r':''}">${w=='b'?'Trợ lý':cur.name} · ${h}</div>`).join('')}<p class="sub" style="margin-top:12px">… còn ${Math.max(0,cur.n-5)} tin nữa</p>
<div class="rt"><b>Đánh giá phiên</b><div class="rb"><button class="h ${rt=='h'?'on':''}" data-a="rt" data-v="h">👍 Hài lòng</button><button class="u ${rt=='u'?'on':''}" data-a="rt" data-v="u">👎 Không hài lòng</button></div><textarea id="rs" placeholder="Lý do · bắt buộc, ít nhất 3 ký tự">${S.rs}</textarea>${S.err?`<div class="er">${S.err}</div>`:''}<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px"><button class="btn" data-a="save">Lưu đánh giá</button><span class="sub" style="margin:0">Nguồn đánh giá: Người review · ghi dưới tên bạn</span></div></div>`}
return`<p class="sub"><span class="b bn">Dữ liệu trực tiếp từ cơ sở dữ liệu OLTP</span> Hàng chờ không dùng kho dữ liệu và không phụ thuộc bộ lọc thời gian.</p><div class="qg"><div class="c"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${ch.map(([k,t])=>`<button class="pill ${S.qf==k?'on':''}" data-a="qf" data-v="${k}">${t}</button>`).join('')}</div>${ls.map((x,i)=>`<div class="qi ${cur&&x.id==cur.id?'on':''}" data-a="qs" data-v="${i}"><b>${x.name}</b><div><span>${x.t} · ${x.n} tin</span>${bdg(x.s)}</div></div>`).join('')}<p class="sub" style="margin-top:12px;text-align:center">J / K: phiên trước · phiên sau</p></div><div class="c">${det}</div></div>`}
function rm(){const ds=days(),B=bk(S.from,S.to,S.g),all=R.map((_,i)=>i);
return`<div class="g g2"><div class="c"><h3>Mật độ tin nhắn theo thời gian</h3><p class="sub">Số tin nhắn trung bình trên mỗi phiên</p>${chart(B.map(b=>b.lab),[{name:'Mật độ',c:'var(--bl)',v:B.map(b=>sM(b.ds).den)}])}</div>
<div class="c"><h3>Tin gốc và tin trả lời</h3><p class="sub">Số tin nhắn theo kỳ</p>${chart(B.map(b=>b.lab),[{name:'Tin gốc',c:'var(--bl)',v:B.map(b=>sM(b.ds).o)},{name:'Tin trả lời',c:'var(--am)',v:B.map(b=>sM(b.ds).r)}],{group:1})}${lg([['Tin gốc','var(--bl)'],['Tin trả lời','var(--am)']])}</div></div>
<div class="c"><h3>So sánh các phòng chat</h3><p class="sub">Tổng hợp theo khoảng thời gian đã chọn</p><div class="tw"><table><tr><th>Phòng</th><th class="n">Số phiên</th><th class="n">Điểm hài lòng</th><th class="n">Không hài lòng</th><th class="n">Tin gốc</th><th class="n">Tin trả lời</th><th class="n">Mật độ tin/phiên</th></tr>${all.map(i=>{const e=sE(ds,[i]),m=sM(ds,[i]),v=cs(e);return`<tr><td><b>${R[i][0]}</b></td><td class="n">${N(m.s)}</td><td class="n">${v==null?'–':Math.round(v)+'%'}</td><td class="n">${N(e.u)}</td><td class="n">${N(m.o)}</td><td class="n">${N(m.r)}</td><td class="n">${f1(m.den)}</td></tr>`}).join('')}</table></div></div>`}
const fs=v=>f1(v)+' giây';
function us(){const ds=days(),rs=US.map(([id,n],i)=>{let c=0,s=0,p=0;ds.forEach(d=>{c+=LU[d][i].n;s+=LU[d][i].s;p+=LU[d][i].p});return{id,n,c,a:c?s/c:0,p:c?p/c:0,lv:LV[i]}}).sort((a,b)=>b.p-a.p),mx=Math.max(1,...rs.map(r=>r.p));
return`<div class="c"><h3>Thời gian phản hồi bot theo người dùng</h3><p class="sub">P50 và P90 trên các yêu cầu trong khoảng thời gian đã chọn · xếp P90 chậm nhất trước</p><div class="tw"><table><tr><th>Người dùng</th><th>Mã Matrix</th><th>Lần truy cập gần nhất</th><th class="n">Số yêu cầu</th><th>P50</th><th>P90</th></tr>${rs.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.id}</td><td>${fm(r.lv)}/2026</td><td class="n">${N(r.c)}</td><td>${r.c?fs(r.a):'–'}</td><td style="min-width:200px"><div style="display:flex;gap:10px;align-items:center"><div class="pb" style="flex:1;margin:0"><i style="width:${r.p/mx*100}%;background:${r.p>mx*.75?'var(--rd)':'var(--bl)'}"></i></div><span>${r.c?fs(r.p):'–'}</span></div></td></tr>`).join('')}</table></div></div>`}
function bt(){const ds=days(),c=sL(ds),B=bk(S.from,S.to,S.g),lb=B.map(b=>b.lab),lb2=B.map(b=>sL(b.ds));
return`<div class="g g4"><div class="c k"><div class="l">Thời gian phản hồi P50</div><div class="v">${f1(c.p50)} s</div><div class="s">${N(c.n)} yêu cầu</div></div><div class="c k"><div class="l">Thời gian phản hồi P90</div><div class="v">${f1(c.p90)} s</div></div><div class="c k"><div class="l">Tỉ lệ phản hồi chậm</div><div class="v">${f1(c.sl/Math.max(1,c.n)*100)}%</div><div class="s">${N(c.sl)} yêu cầu · chậm: trên 5 giây</div></div><div class="c k q"><div class="l">Quá thời gian chờ</div><div class="v">${N(c.to)}</div><div class="s">${f1(c.to/Math.max(1,c.n)*100)}% yêu cầu · chờ trên 30 giây</div></div></div>
<div class="g g2"><div class="c"><h3>Thời gian phản hồi theo thời gian</h3><p class="sub">Đơn vị: giây · bấm cột thời gian để xem chi tiết hơn</p>${chart(lb,[{name:'P50',c:'var(--bl)',v:lb2.map(x=>x.p50)},{name:'P90',c:'var(--rd)',v:lb2.map(x=>x.p90)}])}${lg([['P50','var(--bl)'],['P90','var(--rd)']])}</div>
<div class="c"><h3>Trạng thái phản hồi</h3><p class="sub">Tỉ lệ yêu cầu · Chậm: phản hồi trên 5 giây · Quá thời gian chờ: trên 30 giây</p>${chart(lb,[{name:'Chậm',c:'var(--am)',v:lb2.map(x=>x.sl/Math.max(1,x.n)*100)},{name:'Quá thời gian chờ',c:'var(--rd)',v:lb2.map(x=>x.to/Math.max(1,x.n)*100)}],{pct:1})}${lg([['Chậm','var(--am)'],['Quá thời gian chờ','var(--rd)']])}</div></div>
<div class="c"><h3>Thời gian phản hồi theo phòng chat</h3><p class="sub">Chậm: phản hồi trên 5 giây · Quá thời gian chờ: trên 30 giây</p><div class="tw"><table><tr><th>Phòng</th><th class="n">Yêu cầu</th><th class="n">P50</th><th class="n">P90</th><th class="n">Chậm</th><th class="n">Quá thời gian chờ</th></tr>${R.map((r,i)=>{const x=sL(ds,[i]),pc=v=>f1(v/Math.max(1,x.n)*100)+'%';return`<tr><td><b>${r[0]}</b></td><td class="n">${N(x.n)}</td><td class="n">${f1(x.p50)} s</td><td class="n">${f1(x.p90)} s</td><td class="n">${N(x.sl)} · ${pc(x.sl)}</td><td class="n">${N(x.to)} · ${pc(x.to)}</td></tr>`}).join('')}</table></div></div>`}
const V={tq,kw,rq,rm,us,bt};
function render(){if($('#rs'))S.rs=$('#rs').value;
$('#nav').innerHTML=TABS.map(([k,t])=>`<a href="#${k}" class="${S.tab==k?'on':''}">${t}${k=='rq'?`<span class="bd">${pend().length}</span>`:''}</a>`).join('');
$('#ttl').textContent=TABS.find(t=>t[0]==S.tab)[1];CB=bk(S.from,S.to,S.g);
$('#ctl').innerHTML=S.tab=='rq'?'':`<div class="seg">${[['d','Ngày'],['w','Tuần'],['m','Tháng']].map(([k,t])=>`<button data-a="g" data-v="${k}" class="${S.g==k?'on':''}">${t}</button>`).join('')}</div><input type="date" id="fd" min="${iso(0)}" max="${iso(ND-1)}" value="${iso(S.from)}"><input type="date" id="td" min="${iso(0)}" max="${iso(ND-1)}" value="${iso(S.to)}">`;
$('#main').innerHTML=V[S.tab]()}
function drill(i){const b=CB[i];if(!b||S.g=='d')return;S.from=b.ds[0];S.to=b.ds[b.ds.length-1];S.g=S.g=='m'?'w':'d';render()}
document.addEventListener('click',e=>{const h=e.target.closest('.hit');if(h)return drill(+h.dataset.i);const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=='g'){S.g=v}else if(a=='src'){S.src=v}else if(a=='ks'){S.ks=v;S.kw=0}else if(a=='kw'){S.kw=+v}else if(a=='cloud'){S.cloud=t.checked?1:0}
else if(a=='go'){location.hash=v;return}
else if(a=='qf'){S.qf=v;S.qi=0;S.rt=null;S.rs='';S.err=''}else if(a=='qs'){S.qi=+v;S.rt=null;S.rs='';S.err=''}else if(a=='rt'){S.rt=v}
else if(a=='save'){const P=pend(),ls=S.qf=='all'?P:P.filter(x=>x.s==S.qf),cur=ls[Math.min(S.qi,ls.length-1)],rt=S.rt||(cur.s=='u'?'u':null),r=$('#rs').value.trim();
if(!rt)S.err='Chọn Hài lòng hoặc Không hài lòng trước khi lưu.';else if(r.length<3)S.err='Lý do bắt buộc, ít nhất 3 ký tự.';else{cur.done=1;S.rt=null;S.rs='';S.err=''}}
render()});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='fd'||i=='td'){let v=Math.round((Date.parse(e.target.value)-D0)/864e5);if(isNaN(v))return;v=Math.max(0,Math.min(ND-1,v));if(i=='fd')S.from=Math.min(v,S.to);else S.to=Math.max(v,S.from);render()}else if(i=='ks'){S.ks=e.target.value;S.kw=0;render()}});
document.addEventListener('keydown',e=>{if(S.tab!='rq'||/TEXTAREA|INPUT/.test(e.target.tagName))return;const n=pend().filter(x=>S.qf=='all'||x.s==S.qf).length;if(e.key=='j'){S.qi=Math.min(n-1,S.qi+1)}else if(e.key=='k'){S.qi=Math.max(0,S.qi-1)}else return;S.rt=null;S.rs='';S.err='';render()});
function route(){const h=location.hash.slice(1);S.tab=V[h]?h:'tq';render()}
addEventListener('hashchange',route);route();
</script></body></html>
